<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">EvidenceDesk architecture overview</title><desc id="desc">A source-based design overview. This diagram is not an application screenshot or a claim of live model inference.</desc><rect width="1440" height="820" fill="#0a1424"/><rect x="72" y="58" width="215" height="35" rx="17" fill="#173d39"/><text x="91" y="82" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#79f2ca">PROJECT ARCHITECTURE</text><g font-family="Arial,sans-serif"><text x="72" y="154" font-size="55" font-weight="700" fill="#f5f9ff">EvidenceDesk</text><text x="72" y="202" font-size="23" fill="#a9bdd6">Runnable Python project · uv · Configurable models · Explicit engineering boundaries</text><g transform="translate(72,242)"><rect width="636" height="180" rx="18" fill="#14233b" stroke="#2a4260"/><rect x="24" y="25" width="34" height="34" rx="10" fill="#45d8ae"/><text x="41" y="49" text-anchor="middle" font-size="18" font-weight="700" fill="#08251f">1</text><text x="76" y="51" font-size="27" font-weight="700" fill="#f0f7ff">Ingestion</text><text x="25" y="100" font-size="22" fill="#d8e7fa">PDF, text and Markdown loaders</text><text x="25" y="140" font-size="19" fill="#9eb5d1">Page provenance and overlapping chunks</text></g><g transform="translate(732,242)"><rect width="636" height="180" rx="18" fill="#14233b" stroke="#2a4260"/><rect x="24" y="25" width="34" height="34" rx="10" fill="#45d8ae"/><text x="41" y="49" text-anchor="middle" font-size="18" font-weight="700" fill="#08251f">2</text><text x="76" y="51" font-size="27" font-weight="700" fill="#f0f7ff">Index</text><text x="25" y="100" font-size="22" fill="#d8e7fa">Chroma persistence</text><text x="25" y="140" font-size="19" fill="#9eb5d1">HF embeddings or explicit demo hashing</text></g><g transform="translate(72,446)"><rect width="636" height="180" rx="18" fill="#14233b" stroke="#2a4260"/><rect x="24" y="25" width="34" height="34" rx="10" fill="#45d8ae"/><text x="41" y="49" text-anchor="middle" font-size="18" font-weight="700" fill="#08251f">3</text><text x="76" y="51" font-size="27" font-weight="700" fill="#f0f7ff">Retrieval</text><text x="25" y="100" font-size="22" fill="#d8e7fa">Seven configurable strategies</text><text x="25" y="140" font-size="19" fill="#9eb5d1">Hybrid · MMR · vector · multi-query</text></g><g transform="translate(732,446)"><rect width="636" height="180" rx="18" fill="#14233b" stroke="#2a4260"/><rect x="24" y="25" width="34" height="34" rx="10" fill="#45d8ae"/><text x="41" y="49" text-anchor="middle" font-size="18" font-weight="700" fill="#08251f">4</text><text x="76" y="51" font-size="27" font-weight="700" fill="#f0f7ff">Grounded answers</text><text x="25" y="100" font-size="22" fill="#d8e7fa">One inspectable evidence set</text><text x="25" y="140" font-size="19" fill="#9eb5d1">Citations, owner filters and no-answer path</text></g><line x1="72" y1="693" x2="1368" y2="693" stroke="#29415e"/><text x="72" y="738" font-size="21" fill="#67e6bf">FastAPI · Streamlit · LangChain · Durable state · GitHub Actions</text><text x="72" y="778" font-size="18" fill="#9eb5d1">Design overview from the source. Offline model fixtures and demo embeddings are labeled in the application.</text></g></svg>